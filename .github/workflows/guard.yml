name: guard
# يعمل بنسخة main دائمًا (pull_request_target): الـPR لا يستطيع تعديل الحارس ولا تمرير نسخة منه.
# لا يشغّل كود الـPR، ولا يحمل أي سر.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: fetch PR head as data only (exactly the event's commit, not whatever the PR points to now)
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$HEAD_SHA"
          git cat-file -e "${HEAD_SHA}^{commit}" || { echo "::error::event head ${HEAD_SHA} not fetchable"; exit 1; }
      - name: guard (main's copy)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/guard/guard.sh "$BASE" "$HEAD_SHA"
