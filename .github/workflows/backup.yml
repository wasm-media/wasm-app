name: backup
# نسخة يومية مشفّرة من قاعدة الإنتاج إلى المستودع الخاص wasm-app-backups، ثم استعادة تجريبية من الملف المشفّر نفسه
# داخل Supabase مؤقت في هذا الـrunner (لا في مشروع التطوير الذي يراه Claude — D25، I12). P7، P13.
# بيئة backup: أسرارها لا تصل إلا لفرع main، وبلا موافقة يدوية (تعمل كل ليلة وحدها).
# السجل العام لا يطبع أي صف ولا أي عدد من بيانات الإنتاج؛ تقرير الأعداد الكامل يُرفع مشفّرًا مع النسخة.
on:
  schedule:
    - cron: "17 1 * * *"   # 04:17 بتوقيت غزة
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup
  cancel-in-progress: false
env:
  PROJECT_REF: dldxfkbuxpokryfjjhrq
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: dump production (schema + roles + data of auth/public/private)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/bk"; mkdir -p "$B"
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" > /dev/null
          supabase db dump --linked -p "$SUPABASE_DB_PASSWORD" -f "$B/schema.sql"
          supabase db dump --linked -p "$SUPABASE_DB_PASSWORD" --role-only -f "$B/roles.sql"
          supabase db dump --linked -p "$SUPABASE_DB_PASSWORD" --data-only --use-copy -s auth,public,private -f "$B/data.sql"
          for f in schema roles data; do [ -s "$B/$f.sql" ] || { echo "FAIL: empty $f dump"; exit 1; }; done
          echo "dumps written"
      - name: encrypt (gpg AES256; passphrase only in this environment)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ "${#BACKUP_PASSPHRASE}" -ge 20 ] || { echo "FAIL: BACKUP_PASSPHRASE must be at least 20 characters"; exit 1; }
          cd "$RUNNER_TEMP/bk"
          for f in schema roles data; do
            gzip -9 "$f.sql"
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
              -o "$f.sql.gz.gpg" "$f.sql.gz" 3<<<"$BACKUP_PASSPHRASE"
            rm -f "$f.sql.gz"
          done
          ls "$RUNNER_TEMP/bk"
      - name: push the encrypted dumps first (a failed restore test never costs the day's copy)
        env:
          BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          D=$(date -u +%F); B="$RUNNER_TEMP/bk"; echo "D=$D" >> "$GITHUB_ENV"
          bash .github/ops/push_private.sh "backup $D (run ${GITHUB_RUN_ID})" \
            "$B/schema.sql.gz.gpg:daily/$D/schema.sql.gz.gpg" "$B/roles.sql.gz.gpg:daily/$D/roles.sql.gz.gpg" \
            "$B/data.sql.gz.gpg:daily/$D/data.sql.gz.gpg"
      - name: restore test from the encrypted file (temporary Supabase in this runner) + encrypted report
        id: restore
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # GitHub يشغّل الخطوة بـbash -e: نطفئه هنا ليُكتب التقرير المشفّر ويُمسح الملف المفكوك حتى عند الفشل
          set +e; set -uo pipefail
          R="$RUNNER_TEMP/restore"; mkdir -p "$R"
          rc=1
          if supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector > /dev/null; then
            DB=$(supabase status -o json | jq -r .DB_URL)
            gpg --batch --pinentry-mode loopback --passphrase-fd 3 -d "$RUNNER_TEMP/bk/data.sql.gz.gpg" 3<<<"$BACKUP_PASSPHRASE" 2>/dev/null | gunzip > "$R/data.sql"
            QUIET=1 bash .github/ops/restore_check.sh "$R/data.sql" "$DB" 2> "$R/counts.txt"; rc=$?
          else
            echo "FAIL: supabase start" | tee "$R/counts.txt"
          fi
          rm -f "$R/data.sql"
          { echo "restore test $(date -u +%FT%TZ) run ${GITHUB_RUN_ID} rc=$rc"; cat "$R/counts.txt"; } | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 -o "$R/restore-report.txt.gz.gpg" 3<<<"$BACKUP_PASSPHRASE"
          rm -f "$R/counts.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: push the encrypted restore report (the deploy key lives only in the push steps)
        if: always() && steps.restore.outcome == 'success'
        env:
          BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          bash .github/ops/push_private.sh "restore test $D (run ${GITHUB_RUN_ID}, rc=${{ steps.restore.outputs.rc }})" \
            "$RUNNER_TEMP/restore/restore-report.txt.gz.gpg:daily/$D/restore-report.txt.gz.gpg"
      - name: restore test verdict
        if: always()
        env:
          RC: ${{ steps.restore.outputs.rc }}
        run: |
          [ "${RC:-1}" = 0 ] && echo "PASS restore test" || { echo "FAIL restore test (rc=${RC:-none}) — details in the encrypted report"; exit 1; }
