# إعداد Supabase المحلي (للـCI فقط: `supabase start`). الإنتاج يُضبط من لوحته ويُقاس (P17، P19).
project_id = "wasm-app"

[db]
major_version = 17

[auth]
site_url = "http://127.0.0.1:8080"
jwt_expiry = 3600
enable_signup = false                  # P17: لا تسجيل ذاتي — الحسابات بدعوة فقط
enable_refresh_token_rotation = true   # P19: تدوير رموز التجديد وكشف إعادة استعمالها
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
enable_confirmations = false
